# ===============================
# 🔧 SERVER CONFIGURATION
# ===============================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# 🌐 SPRING APPLICATION
# ===============================
spring.application.name=CyberTec Store

# ===============================
# 🗄️ DATABASE CONFIGURATION - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cybertec_store?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# 🏗️ JPA / HIBERNATE CONFIGURATION
# ===============================
# DDL auto (create, create-drop, update, validate, none)
# DEVELOPMENT: update - actualiza el esquema automáticamente
# PRODUCTION: validate - solo valida, no modifica
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Naming strategy (snake_case en BD)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Deshabilitar Open Session In View (mejor práctica)
spring.jpa.open-in-view=false

# Batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# 🔐 JWT CONFIGURATION
# ===============================
# Clave secreta SEGURA en Base64 (>= 512 bits para HS512)
# IMPORTANTE: En producción, usa una variable de entorno
jwt.secret=ZRlq2QKq5TgGgq1T3Qk3J5kY8lq1m4z6w7x9y1A3B5C7D9E1F3H5J7L9N1P3R5T7V9X1Z3b5d7f9h1j3l5n7p9r1t3v5x7z9==

# Tiempo de expiración en milisegundos
# 86400000 ms = 24 horas
# 3600000 ms = 1 hora
jwt.expiration=86400000

# ===============================
# 🤖 GEMINI AI CONFIGURATION
# ===============================
# Obtén tu API key en: https://makersuite.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:TU_API_KEY_AQUI}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# ===============================
# 🪵 LOGGING CONFIGURATION
# ===============================
# Nivel general
logging.level.root=INFO

# Nivel de tu aplicación
logging.level.com.cybertec=DEBUG

# Spring Framework
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# Hibernate SQL (útil para desarrollo)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Patrón de log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# ⚙️ SPRING DOC / SWAGGER CONFIGURATION
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none

# ===============================
# 🔄 FLYWAY CONFIGURATION (Opcional)
# ===============================
# Habilitar/deshabilitar Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# 🌍 INTERNATIONALIZATION
# ===============================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===============================
# 📦 JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
spring.jackson.default-property-inclusion=non_null

# ===============================
# ⚡ PERFORMANCE
# ===============================
spring.jmx.enabled=false