# ===============================
# 🔧 SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# 🌐 SPRING APPLICATION
# ===============================
spring.application.name=cybertec-store

# ===============================
# 🔐 JWT CONFIGURATION
# ===============================
# Clave secreta segura codificada en Base64 (>= 512 bits para HS512)
jwt.secret=ZRlq2QKq5TgGgq1T3Qk3J5kY8lq1m4z6w7x9y1A3B5C7D9E1F3H5J7L9N1P3R5T7V9X1Z3b5d7f9h1j3l5n7p9r1t3v5x7z9==
# Tiempo de expiración del token en milisegundos (24 horas)
jwt.expiration=86400000

# ===============================
# 🤖 GEMINI AI CONFIGURATION
# ===============================
gemini.api.key=${GEMINI_API_KEY:TU_API_KEY_AQUI}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# ===============================
# 🪵 LOGGING CONFIGURATION
# ===============================
logging.level.com.cybertec=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# ⚙️ SPRING DOC / SWAGGER CONFIGURATION
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
